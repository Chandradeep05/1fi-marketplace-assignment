name: CI

'on':
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: marketplace
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
          cache-dependency-path: 'services/api/requirements.txt'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r services/api/requirements.txt

      - name: Verify Contracts Typecheck
        run: |
          npm --workspace=packages/contracts run typecheck

      - name: Run Alembic Migrations
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+asyncpg://marketplace:marketplace@localhost:5432/marketplace
          DATABASE_URL_SYNC: postgresql://marketplace:marketplace@localhost:5432/marketplace
        run: |
          alembic upgrade head

      - name: Run Pytest Suite with PostgreSQL & Redis
        working-directory: services/api
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://marketplace:marketplace@localhost:5432/marketplace
          DATABASE_URL: postgresql+asyncpg://marketplace:marketplace@localhost:5432/marketplace
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m pytest tests/ -v
