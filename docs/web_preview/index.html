<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>1Fi Marketplace Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #7C3AED;
    --primary-dark: #5B21B6;
    --primary-light: #EDE9FE;
    --bg: #F5F5F7;
    --surface: #FFFFFF;
    --text-p: #161422;
    --text-s: #6B7280;
    --bdr: #E8E7ED;
    --success: #16A34A;
    --gold: #F5B324;
  }
  ::-webkit-scrollbar { display: none; width: 0; height: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; -ms-overflow-style: none; scrollbar-width: none; }
  body { background: var(--bg); display: flex; justify-content: center; align-items: flex-start; margin: 0; padding: 0; overflow: hidden; }
  .phone {
    width: 390px;
    height: 844px;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .status-bar {
    height: 44px;
    background: var(--surface);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-p);
  }
  .island { width: 110px; height: 26px; background: #000; border-radius: 20px; }
  .content { flex: 1; overflow-y: auto; padding-bottom: 84px; }
  .header {
    background: var(--surface);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--bdr);
    position: sticky;
    top: 0;
    z-index: 40;
  }
  .header-left { display: flex; align-items: center; gap: 8px; }
  .logo { width: 28px; height: 28px; background: var(--primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 14px; }
  .header-title { font-size: 18px; font-weight: 800; color: var(--text-p); }
  .back-btn { background: none; border: none; font-size: 15px; cursor: pointer; color: var(--primary); font-weight: 700; }
  
  /* Shop Hero Banner */
  .shop-hero {
    background: #1E0A8A;
    padding: 16px 18px;
    border-bottom-left-radius: 24px;
    border-bottom-right-radius: 24px;
    color: #fff;
  }
  .hero-pill {
    background: rgba(255, 255, 255, 0.15);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 800;
    display: inline-block;
    margin-bottom: 8px;
    border: 1px solid rgba(255, 255, 255, 0.25);
  }
  .shop-hero-row { display: flex; justify-content: space-between; align-items: center; }
  .shop-hero-title { font-size: 22px; font-weight: 800; line-height: 1.25; }
  .shop-hero-sub { font-size: 11px; color: rgba(255, 255, 255, 0.85); margin-top: 6px; line-height: 1.4; }
  .shop-hero-badge {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }

  /* Segmented Sub Tabs */
  .sub-tabs {
    display: flex;
    background: #F3F0FA;
    border-radius: 28px;
    padding: 4px;
    margin: 12px 16px;
    border: 1px solid #E8E4F5;
  }
  .sub-tab {
    flex: 1;
    padding: 8px 4px;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-s);
    cursor: pointer;
    border-radius: 24px;
    position: relative;
  }
  .sub-tab.active {
    background: #FFFFFF;
    color: var(--primary-dark);
    font-weight: 800;
    box-shadow: 0 2px 6px rgba(91, 33, 182, 0.1);
  }
  .sub-tab.active::after {
    content: '';
    display: block;
    width: 24px;
    height: 3px;
    background: var(--primary-dark);
    border-radius: 2px;
    margin: 3px auto 0;
  }

  /* Brand Cards */
  .brand-card {
    background: var(--surface);
    border-radius: 18px;
    padding: 14px;
    display: flex;
    align-items: center;
    margin: 0 16px 12px;
    border: 1px solid var(--bdr);
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,0.03);
  }
  .brand-logo-box {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 11px;
    margin-right: 14px;
    text-align: center;
    padding: 4px;
  }

  /* Eligibility Strip */
  .eligibility-strip {
    background: var(--surface);
    margin: 12px 16px;
    padding: 14px 16px;
    border-radius: 16px;
    border: 1px solid var(--bdr);
  }
  .pill {
    background: var(--primary-light);
    color: var(--primary-dark);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 20px;
    display: inline-block;
    margin-bottom: 6px;
  }
  .strip-row { display: flex; justify-content: space-between; align-items: baseline; }
  .strip-label { font-size: 12px; color: var(--text-s); font-weight: 500; }
  .strip-amount { font-size: 20px; font-weight: 800; color: var(--success); }
  .strip-sub { font-size: 11px; color: var(--text-s); margin-top: 4px; }
  
  /* Search & Chips */
  .search-box { margin: 0 16px 12px; position: relative; }
  .search-input {
    width: 100%;
    padding: 12px 16px 12px 38px;
    border-radius: 12px;
    border: 1px solid var(--bdr);
    background: var(--surface);
    font-size: 13px;
  }
  .search-icon { position: absolute; left: 12px; top: 12px; font-size: 14px; color: var(--text-s); }
  .chips { display: flex; gap: 8px; padding: 0 16px 12px; overflow-x: auto; }
  .chip {
    padding: 7px 14px;
    background: var(--surface);
    border: 1px solid var(--bdr);
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-s);
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  
  /* Products Grid */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px; }
  .card {
    background: var(--surface);
    border-radius: 16px;
    border: 1px solid var(--bdr);
    padding: 12px;
    display: flex;
    flex-direction: column;
    cursor: pointer;
  }
  .card-img { width: 100%; height: 110px; object-fit: contain; margin-bottom: 8px; border-radius: 8px; background: #fafafa; }
  .card-badge {
    font-size: 9px;
    font-weight: 700;
    background: #FEF3C7;
    color: #92400E;
    padding: 2px 6px;
    border-radius: 4px;
    align-self: flex-start;
    margin-bottom: 4px;
  }
  .card-title { font-size: 13px; font-weight: 700; color: var(--text-p); margin-bottom: 4px; }
  .card-price-row { display: flex; align-items: baseline; gap: 6px; margin-top: auto; }
  .card-price { font-size: 14px; font-weight: 800; color: var(--text-p); }
  .card-mrp { font-size: 11px; text-decoration: line-through; color: var(--text-s); }
  .card-emi { font-size: 11px; font-weight: 700; color: var(--primary); margin-top: 4px; }
  
  /* Detail Screen */
  .detail-hero { background: var(--surface); padding: 16px; border-bottom: 1px solid var(--bdr); text-align: center; }
  .detail-hero img { width: 160px; height: 160px; object-fit: contain; margin-bottom: 12px; }
  .detail-title { font-size: 19px; font-weight: 800; color: var(--text-p); text-align: left; }
  .detail-sub { font-size: 12px; color: var(--text-s); text-align: left; margin-top: 4px; }
  .detail-pricing { display: flex; align-items: baseline; gap: 10px; margin-top: 10px; text-align: left; }
  .detail-price { font-size: 24px; font-weight: 800; color: var(--text-p); }
  .detail-mrp { font-size: 14px; text-decoration: line-through; color: var(--text-s); }
  .save-pill { background: #DCFCE7; color: #166534; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
  
  .sec-label { font-size: 13px; font-weight: 700; color: var(--text-p); margin: 16px 16px 8px; }
  .variant-row { display: flex; gap: 8px; padding: 0 16px; }
  .variant-chip {
    padding: 8px 14px;
    background: var(--surface);
    border: 1.5px solid var(--bdr);
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-p);
    cursor: pointer;
  }
  .variant-chip.active { border-color: var(--primary); background: var(--primary-light); color: var(--primary-dark); }
  
  /* EMI Cards */
  .emi-list { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
  .emi-card {
    background: var(--surface);
    border: 1.5px solid var(--bdr);
    border-radius: 14px;
    padding: 14px;
    cursor: pointer;
  }
  .emi-card.selected { border-color: var(--primary); background: #FAF5FF; }
  .emi-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .emi-tenure { font-size: 15px; font-weight: 800; color: var(--text-p); display: flex; align-items: center; gap: 8px; }
  .radio-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid #D1D5DB;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
  }
  .emi-card.selected .radio-dot { border-color: var(--primary); background: var(--primary); color: white; font-weight: 900; }
  .emi-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
  .badge-rec { background: var(--gold); color: #78350F; }
  .emi-amount { font-size: 19px; font-weight: 800; color: var(--text-p); margin-bottom: 4px; }
  .emi-card.selected .emi-amount { color: var(--primary); }
  .emi-footer { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-s); border-top: 1px solid var(--bdr); padding-top: 6px; margin-top: 6px; }
  
  .sticky-cta {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-top: 1px solid var(--bdr);
    padding: 12px 16px 28px;
    z-index: 60;
  }
  .cta-btn {
    width: 100%;
    background: var(--primary);
    color: white;
    border: none;
    padding: 16px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .expiry-banner {
    background: #FEF2F2;
    border: 1px solid #FECACA;
    color: #991B1B;
    margin: 12px 16px;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  
  /* Checkout Screen */
  .checkout-sec {
    background: var(--surface);
    margin: 12px 16px;
    border-radius: 16px;
    border: 1px solid var(--bdr);
    padding: 16px;
  }
  .checkout-title { font-size: 14px; font-weight: 800; color: var(--text-p); margin-bottom: 12px; }
  .checkout-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-s); margin-bottom: 8px; }
  .checkout-row.bold { color: var(--text-p); font-weight: 800; font-size: 15px; border-top: 1px dashed var(--bdr); padding-top: 10px; margin-top: 10px; }
  .idempotency-badge {
    background: #F0FDF4;
    border: 1px solid #BBF7D0;
    color: #166534;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    margin: 12px 16px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  
  /* Success Screen */
  .success-view { text-align: center; padding: 60px 24px; }
  .success-icon {
    width: 72px;
    height: 72px;
    background: #DCFCE7;
    color: #16A34A;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    margin: 0 auto 20px;
    font-weight: 900;
  }
  .success-title { font-size: 22px; font-weight: 800; color: var(--text-p); margin-bottom: 8px; }
  .success-sub { font-size: 13px; color: var(--text-s); line-height: 1.5; margin-bottom: 24px; }
  .intent-box {
    background: var(--surface);
    border: 1px solid var(--bdr);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 24px;
    text-align: left;
  }
  .intent-label { font-size: 11px; color: var(--text-s); font-weight: 600; text-transform: uppercase; }
  .intent-id { font-size: 14px; font-weight: 800; color: var(--primary); font-family: monospace; margin-top: 4px; }
  
  /* Production 5-Tab Bar with Top Purple Indicator */
  .tab-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 68px;
    background: var(--surface);
    border-top: 1px solid #F3F4F6;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 50;
    padding-bottom: 6px;
    box-shadow: 0 -3px 10px rgba(0, 0, 0, 0.05);
  }
  .tab-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 10px;
    font-weight: 700;
    color: #9CA3AF;
    cursor: pointer;
    gap: 3px;
    position: relative;
    padding-top: 6px;
    width: 20%;
  }
  .tab-item.active { color: var(--primary); }
  .tab-indicator {
    position: absolute;
    top: 0;
    width: 28px;
    height: 3px;
    background: var(--primary);
    border-radius: 2px;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="status-bar">
    <span>9:41</span>
    <div class="island"></div>
    <span>100% ⚡</span>
  </div>

  <div class="content" id="app"></div>

  <div class="tab-bar" id="tabBar">
    <div class="tab-item" id="tab-home" onclick="setMainTab('home')">
      <img src="icons/tab_home.png" style="width:22px; height:22px; object-fit:contain; opacity:0.65;"><span>Home</span>
    </div>
    <div class="tab-item active" id="tab-shop" onclick="setMainTab('shop')">
      <div class="tab-indicator"></div>
      <img src="icons/tab_shop.png" style="width:22px; height:22px; object-fit:contain; filter: invert(24%) sepia(90%) saturate(4529%) hue-rotate(258deg) brightness(94%) contrast(97%);"><span>Shop</span>
    </div>
    <div class="tab-item" id="tab-dues" onclick="setMainTab('dues')">
      <img src="icons/tab_dues.png" style="width:22px; height:22px; object-fit:contain; opacity:0.65;"><span>EMI Dues</span>
    </div>
    <div class="tab-item" id="tab-limit" onclick="setMainTab('limit')">
      <img src="icons/tab_limit.png" style="width:22px; height:22px; object-fit:contain; opacity:0.65;"><span>Limit</span>
    </div>
    <div class="tab-item" id="tab-profile" onclick="setMainTab('profile')">
      <img src="icons/tab_profile.png" style="width:22px; height:22px; object-fit:contain; opacity:0.65;"><span>Profile</span>
    </div>
  </div>
</div>

<script>
let currentTab = 'shop'; // 'home', 'shop', 'dues', 'limit', 'profile'
let shopSubTab = 'marketplace'; // 'brands', 'nearby', 'marketplace'
let currentView = 'catalogue'; // 'catalogue', 'detail', 'checkout', 'success'
let activeProductId = 'iphone-17-pro';
let activeVariant = '128 GB';
let activePlan = '36m';
let searchQuery = '';
let activeCat = 'all';
let currentIntentId = '';

const PRODUCTS = [
  {
    id: 'iphone-17-pro',
    name: 'Apple iPhone 17 Pro',
    brand: 'Apple',
    category: 'smartphones',
    price: 134900,
    mrp: 139900,
    img: 'https://store.storeimages.cdn-apple.com/4668/as-images.apple.com/is/iphone-15-pro-finish-select-202309-6-7inch-naturaltitanium?wid=5120&hei=2880&fmt=p-jpg',
    sub: 'A19 Pro Chip · Titanium Frame · Pro Camera System',
    badge: '0% No-Cost EMI',
    variants: ['128 GB', '256 GB', '512 GB', '1 TB'],
    plans: {
      '36m': { tenure: 36, monthly: 3747, total: 134900, isNoCost: true, rec: true },
      '24m': { tenure: 24, monthly: 5620, total: 134900, isNoCost: true, rec: false },
      '12m': { tenure: 12, monthly: 11241, total: 134900, isNoCost: true, rec: false },
    }
  },
  {
    id: 'galaxy-s25-ultra',
    name: 'Samsung Galaxy S25 Ultra',
    brand: 'Samsung',
    category: 'smartphones',
    price: 129900,
    mrp: 134900,
    img: 'https://images.samsung.com/is/image/samsung/p6pim/in/2401/gallery/in-galaxy-s24-s928-sm-s928bztqins-thumb-539573341',
    sub: 'Galaxy AI · S Pen · 200MP Camera · Titanium Frame',
    badge: 'Recommended',
    variants: ['256 GB', '512 GB', '1 TB'],
    plans: {
      '36m': { tenure: 36, monthly: 3608, total: 129900, isNoCost: true, rec: true },
      '24m': { tenure: 24, monthly: 5412, total: 129900, isNoCost: true, rec: false },
      '12m': { tenure: 12, monthly: 10825, total: 129900, isNoCost: true, rec: false },
    }
  },
  {
    id: 'sony-wh1000xm5',
    name: 'Sony WH-1000XM6',
    brand: 'Sony',
    category: 'audio',
    price: 29990,
    mrp: 34990,
    img: 'https://www.sony.co.in/image/5d02da5df552836db894cead8a68f5f3?fmt=pjpeg&wid=330',
    sub: 'Industry-leading Noise Cancelling · 30hr Battery · Hi-Res Audio',
    badge: '0% EMI',
    variants: ['Black', 'Silver', 'Midnight Blue'],
    plans: {
      '36m': { tenure: 36, monthly: 833, total: 29990, isNoCost: true, rec: true },
      '24m': { tenure: 24, monthly: 1249, total: 29990, isNoCost: true, rec: false },
      '12m': { tenure: 12, monthly: 2499, total: 29990, isNoCost: true, rec: false },
    }
  },
  {
    id: 'macbook-pro-14-m4',
    name: 'Apple MacBook Pro 14" M4',
    brand: 'Apple',
    category: 'laptops',
    price: 169900,
    mrp: 179900,
    img: 'https://store.storeimages.cdn-apple.com/4668/as-images.apple.com/is/mbp14-spaceblack-select-202310?wid=904&hei=840&fmt=jpeg&qlt=90&.v=1697311054290',
    sub: 'Apple M4 Pro chip · 18GB Unified Memory · Liquid Retina XDR',
    badge: 'Flagship Deal',
    variants: ['512 GB SSD', '1 TB SSD'],
    plans: {
      '36m': { tenure: 36, monthly: 4719, total: 169900, isNoCost: true, rec: true },
      '24m': { tenure: 24, monthly: 7079, total: 169900, isNoCost: true, rec: false },
      '12m': { tenure: 12, monthly: 14158, total: 169900, isNoCost: true, rec: false },
    }
  }
];

function generateIntentUlid() {
  const chars = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
  let rand = '';
  for (let i = 0; i < 20; i++) rand += chars[Math.floor(Math.random() * chars.length)];
  return 'ci_01JK' + rand.slice(0, 18);
}

function selectProduct(id) {
  activeProductId = id;
  const prod = PRODUCTS.find(p => p.id === id) || PRODUCTS[0];
  activeVariant = prod.variants[0];
  currentView = 'detail';
  render();
}

function formatInr(val) {
  return '₹' + Number(val).toLocaleString('en-IN');
}

function updateTabBar() {
  const tabs = ['home', 'shop', 'dues', 'limit', 'profile'];
  tabs.forEach(t => {
    const el = document.getElementById('tab-' + t);
    if (el) {
      if (t === currentTab) {
        el.className = 'tab-item active';
        el.innerHTML = '<div class="tab-indicator"></div>' + getTabContent(t);
      } else {
        el.className = 'tab-item';
        el.innerHTML = getTabContent(t);
      }
    }
  });
}

function getTabContent(t) {
  const active = (t === currentTab);
  const filterStyle = active
    ? 'filter: invert(24%) sepia(90%) saturate(4529%) hue-rotate(258deg) brightness(94%) contrast(97%);'
    : 'opacity: 0.65;';
  const iconImg = `<img src="icons/tab_${t}.png" style="width:22px; height:22px; object-fit:contain; ${filterStyle}">`;

  switch (t) {
    case 'home': return `${iconImg}<span>Home</span>`;
    case 'shop': return `${iconImg}<span>Shop</span>`;
    case 'dues': return `${iconImg}<span>EMI Dues</span>`;
    case 'limit': return `${iconImg}<span>Limit</span>`;
    case 'profile': return `${iconImg}<span>Profile</span>`;
  }
}

function setMainTab(tab) {
  currentTab = tab;
  currentView = 'catalogue';
  updateTabBar();
  render();
}

function render() {
  const app = document.getElementById('app');
  const tb = document.getElementById('tabBar');
  updateTabBar();

  if (currentTab === 'home') {
    tb.style.display = 'flex';
    app.innerHTML = `
      <div style="padding:16px;">
        <div style="background:#20037A; border-radius:20px; padding:18px; color:#fff; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-size:10px; font-weight:800; color:rgba(255,255,255,0.75); letter-spacing:0.8px; margin-bottom:4px;">GET STARTED</div>

        <div class="checkout-row"><span>Credit Line Provider</span><span style="font-weight:600;">1Fi Capital Partners</span></div>
        <div class="checkout-row"><span>Product Price</span><span>${formatInr(prod.price)}</span></div>
        <div class="checkout-row"><span>Financing Cashback</span><span style="color:var(--success); font-weight:700;">- ₹0</span></div>
        <div class="checkout-row"><span>Processing Fee</span><span style="color:var(--success); font-weight:700;">FREE (₹0)</span></div>
        <div class="checkout-row"><span>Tenure</span><span style="font-weight:600;">${plan.tenure} Months</span></div>
        <div class="checkout-row"><span>Interest Rate</span><span style="color:var(--success); font-weight:700;">0.0% (No-Cost EMI)</span></div>
        <div class="checkout-row bold">
          <span>Monthly Installment:</span>
          <span style="color:var(--primary);">${formatInr(plan.monthly)} / mo</span>
        </div>
      </div>
      <div class="sticky-cta">
        <button class="cta-btn" onclick="currentIntentId = generateIntentUlid(); currentView='success'; render()">
          Confirm & Create Checkout Intent →
        </button>
      </div>
    `;
  } else if (currentView === 'success') {
    tb.style.display = 'none';
    app.innerHTML = `
      <div class="success-view">
        <div class="success-icon">✓</div>
        <div class="success-title">Your request has been noted!</div>
        <div class="success-sub">Your mutual-fund backed credit line EMI reservation has been logged with PostgreSQL authority.</div>
        <div class="intent-box">
          <div class="intent-label">INTENT REFERENCE ULID</div>
          <div class="intent-id">${currentIntentId}</div>
          <div style="display:flex; justify-content:space-between; margin-top:8px; font-size:11px; color:var(--text-s);">
            <span>Status: <b style="color:var(--success);">Received</b></span>
            <span>Database: <b>PostgreSQL Verified</b></span>
          </div>
        </div>
        <button class="cta-btn" onclick="currentView='catalogue'; render()" style="background:var(--primary-dark);">
          Back to Marketplace
        </button>
      </div>
    `;
  }
}

window.setView = function(v) { currentView = v; render(); };
window.setCat = function(c) { activeCat = c; render(); };
window.setPlan = function(p) { activePlan = p; render(); };
window.setSearch = function(s) { searchQuery = s; render(); };
window.selectProduct = selectProduct;
window.setMainTab = setMainTab;

render();
</script>
</body>
</html>
